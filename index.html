<style>
:root{color-scheme:dark;--base:#0a0a0b;--l1:#131314;--l2:#1b1b1d;--line:#ffffff14;--line2:#ffffff29;--fg:#f4f4f5;--fg2:#a1a1a8;--fg3:#6b6b73;--hov:#ffffff0f;--act:#ffffff1a;--tw:#a970ff;--kk:#53fc18;--yt:#ff5a52;--ok:#6fe3a1;--warn:#e8c46c;--bad:#ff8b85}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--base);color:var(--fg);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;letter-spacing:-.1px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden;height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit;letter-spacing:-.2px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input{background:transparent;border:0;padding:8px 10px;min-width:0;width:150px;outline:none}
input::placeholder{color:var(--fg3)}
button{background:none;border:1px solid transparent;border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--fg2);font-weight:500;transition:background .1s,color .1s,border-color .1s}
button:hover{background:var(--hov);color:var(--fg)}
button:active{background:var(--act)}
button:disabled{opacity:.5;pointer-events:none}
button:focus-visible,a:focus-visible{outline:1px solid var(--fg);outline-offset:2px}

header{padding:22px 16px 14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
h1{flex:0 0 100%;text-align:center;margin:0 0 12px;font-size:24px;line-height:1.35;font-weight:600;letter-spacing:-.48px}
.rb{position:relative;display:inline-block}
.rb i{position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:999px;transform-origin:left center;
 background-image:linear-gradient(90deg,#ffffff40 0,#ffffff40 35%,#6366f1 40%,#a855f7 45%,#ec4899 50%,#f97316 55%,#eab308 60%,#ffffff40 65%,#ffffff40 100%);
 background-size:400% 100%;
 animation:wipe .8s cubic-bezier(.16,1,.3,1) .8s 1 backwards,shimmer 3s linear .4s 1}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.c{display:flex;gap:4px;align-items:center;padding:4px 6px 4px 14px;border-radius:24px;background:var(--l2);border:1px solid var(--line);transition:border-color .15s}
.c:focus-within{border-color:var(--line2)}
.c input.sm{width:110px;border-left:1px solid var(--line);border-radius:0}
.c button{border-radius:999px;background:var(--fg);color:#0a0a0b;font-weight:600;padding:7px 16px}
.c button:hover{background:#fff;color:#0a0a0b}
.c button:active{background:#d4d4d8}
.c button.live{background:transparent;color:var(--fg);border-color:var(--line2)}
.c button.live:hover{background:var(--hov);color:var(--fg)}
.st{font-size:12px;color:var(--fg3);min-width:62px;padding:0 6px}
.st.on{color:var(--ok)}.st.err{color:var(--bad)}.st.wait{color:var(--warn)}

.tg-row{flex:0 0 100%;display:flex;justify-content:center}
.chan-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:999px;border-color:var(--line);color:var(--fg2)}
.chan-btn:hover{border-color:var(--line2)}
.chev{width:16px;height:16px;transition:transform .2s}
.chan-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.mini{display:inline-flex;gap:9px;margin-left:4px;padding-left:10px;border-left:1px solid var(--line)}
.m{position:relative;display:inline-flex;opacity:.35;transition:opacity .15s}
.m svg{width:15px;height:15px}
.m.tw{color:var(--tw)}.m.kk{color:var(--kk)}.m.yt{color:#f00}
.m.on,.m.wait,.m.err{opacity:1}
.m.on::after,.m.wait::after,.m.err::after{content:"";position:absolute;right:-3px;top:-3px;width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 2px var(--base)}
.m.on::after{background:var(--ok)}.m.wait::after{background:var(--warn)}.m.err::after{background:var(--bad)}
.cons{flex:0 0 100%;display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s cubic-bezier(.16,1,.3,1)}
.cons.open{grid-template-rows:1fr}
.cons-in{overflow:hidden;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;visibility:hidden;transition:visibility 0s .25s}
.cons.open .cons-in{visibility:visible;transition-delay:0s}
.cons-in .c{margin:12px 3px 3px}
.sw{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px}
.sw i{position:relative;width:26px;height:16px;border-radius:999px;background:var(--act);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--fg2);transition:transform .15s,background .15s}
.sw.on i{background:var(--fg)}.sw.on i::after{transform:translateX(10px);background:#0a0a0b}
.sv-t{display:none}
#chat.nosv .sv .em{display:none}
#chat.nosv .sv-t{display:inline}
#tip{position:fixed;left:0;top:0;z-index:50;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 16px);padding:5px 10px;border-radius:10px;background:var(--l2);border:1px solid var(--line2);font-size:12px;line-height:1.4;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s}
#tip.show{opacity:1}
#tip .tn{min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--fg)}
#tip .tp{flex:none;display:inline-flex;align-items:center;gap:5px;padding-left:8px;border-left:1px solid var(--line2)}

function sevLoad(url,pick){
  const o={map:null,done:false,waited:false};
  o.p=fetch(url).then(r=>r.ok?r.json():null).then(j=>{
    const set=pick(j),m=new Map();
    for(const e of (set&&set.emotes)||[]){
      if(!e||!e.id||!e.name)continue;
      const f=((e.data&&e.data.host&&e.data.host.files)||[]).find(x=>x.name==='2x.webp');
      m.set(e.name,{url:'https://cdn.7tv.app/emote/'+e.id+'/2x.webp',w:f&&f.width&&f.height?Math.min(112,Math.round(28*f.width/f.height)):0});
    }
    o.map=m;
  }).catch(()=>{}).then(()=>{o.done=true});
  return o;
}
async function sevWait(p,room){
  const a=SEV.g||(SEV.g=sevLoad('https://7tv.io/v3/emote-sets/global',j=>j));
  const k=p+':'+room,b=room?(SEV.ch[k]||(SEV.ch[k]=sevLoad('https://7tv.io/v3/users/'+SVP[p]+'/'+encodeURIComponent(room),j=>j&&j.emote_set))):null;
  const os=[a,b].filter(Boolean),pend=os.filter(o=>!o.done&&!o.waited);
  if(pend.length){pend.forEach(o=>o.waited=true);await Promise.race([Promise.all(pend.map(o=>o.p)),new Promise(r=>setTimeout(r,2500))])}
  return os.map(o=>o.map);
}
function sevApply(toks,maps){
  const[g,c]=maps||[];
  if(!(g&&g.size)&&!(c&&c.size))return toks;
  const out=[];
  const push=t=>{if(typeof t==='string'){if(t==='')return;if(typeof out[out.length-1]==='string'){out[out.length-1]+=t;return}}out.push(t)};
  for(const t of toks){
    if(typeof t!=='string'){out.push(t);continue}
    for(const w of t.split(/(\s+)/)){const e=(c&&c.get(w))||(g&&g.get(w));push(e?{url:e.url,name:w,w:e.w,src:'7tv'}:w)}
  }

}

function lbLink(u){

    for(const k of [...x.searchParams.keys()])if(/^(utm_|fbclid$|gclid$|igshid$|si$|ref$)/i.test(k))x.searchParams.delete(k);
    return x.hostname.replace(/^www\./i,'').toLowerCase()+x.pathname.replace(/\/+$/,'')+x.search;
  }catch{return String(u)}
}
function lbAdd(p,ch,name,text,urls,ts){
  if(!name||!ts)return;
  const t=String(text||'').toLowerCase().replace(/\s+/g,' ').trim().slice(0,120);
  if(!t&&!(urls&&urls.length))return;
  const uk=ukey(p,name),sg=ts+'|'+uk+'|'+t;

  LB.sig.add(sg);

  let c=LB.chs.get(ck);if(!c){c={p:p||'',ch,n:0,last:0};LB.chs.set(ck,c)}

  LB.names.set(uk,String(name));

  if(a.length&&ts<a[a.length-1].ts)LB.sorted=false;
  a.push({ts,ck,uk,t,l:urls&&urls.length?[...new Set(urls.map(lbLink))].slice(0,5):null});

function lbPrune(){

  for(const c of LB.chs.values())c.n=0;
  for(const e of a){const c=LB.chs.get(e.ck);if(c)c.n++}
  for(const[k,c]of LB.chs)if(!c.n)LB.chs.delete(k);
}
function lbCalc(kind,ck,per,gap){
  const a=lbSorted(),since=per?Date.now()-per:0,top=new Map(),S=new Map(),seen=new Set();
  gap*=1000;let total=0;

    if(e.ts<since)continue;

    const sk=e.ck+'|'+e.uk;
    let s=S.get(sk);if(!s){s={c:-1e15,pt:'',pts:-1e15};S.set(sk,s)}

}

    }catch(e){stop=true;status('yt','err',e.message==='no live chat'?'no live chat found':'API error');console.warn(e);return false}
    poll();return true},
    stop(){stop=true;clearTimeout(timer);status('yt','','off')}};
}

const LOG={h:null,buf:[],mem:[],on:false,fs:'showSaveFilePicker' in window&&'showOpenFilePicker' in window,name:'',n:0,t:0,busy:0,err:0,asked:0,base:'',fix:0,sw:0,pend:[],opening:0};
const logName=()=>'ater-chat-log-'+new Date().toISOString().slice(0,10)+'.jsonl';
function logUI(){
  const b=$('#logb');b.classList.toggle('on',LOG.on&&!LOG.err);b.classList.toggle('err',!!LOG.err);
  b.textContent=LOG.on?'Logging · '+LOG.n:'Log';
  b.title=LOG.err?'Could not write the file - will keep retrying; click to stop':LOG.on?(LOG.h?'Saving to '+LOG.name+' - click to stop':LOG.base?'Earlier log loaded; new messages are kept in this tab - click to download the combined file and stop':'Kept in this tab - click to download and stop'):'Keep a chat history file';
}
function logAdd(p,name,text,ev,rp,urls,ts){
  if(!LOG.on&&!LOG.sw)return;
  const o={time:new Date(ts||Date.now()).toISOString(),platform:PL[p],channel:CHAN[p],user:name,type:ev?'alert':rp?'reply':'chat'};
  if(ev){o.kind=ev.k;o.event=ev.t}
  if(text)o.text=text;if(rp)o.replyTo={user:rp.n,text:rp.t};if(urls.length)o.links=urls;
  const line=JSON.stringify(o)+'\n';
  if(LOG.sw){LOG.pend.push(line);return}
  if(LOG.h){LOG.buf.push(line);if(!LOG.t)LOG.t=setTimeout(flush,4000)}
  else{LOG.mem.push(line);if(LOG.mem.length>50000)LOG.mem.shift()}
  LOG.n++;logUI();
}
async function flush(){
  LOG.t=0;if(!LOG.h||!LOG.buf.length||LOG.busy)return;
  LOG.busy=1;const body=LOG.buf.join(''),txt=(LOG.fix?'\n':'')+body;LOG.buf=[];
  try{const w=await LOG.h.createWritable({keepExistingData:true});await w.seek((await LOG.h.getFile()).size);await w.write(txt);await w.close();LOG.err=0;LOG.fix=0}
  catch(e){LOG.buf.unshift(body);LOG.err=1;console.warn(e)}
  LOG.busy=0;logUI();
  if(LOG.buf.length&&!LOG.t)LOG.t=setTimeout(flush,4000);
}
async function startLog(){
  let h=null;
  if(LOG.fs){
    try{h=await showSaveFilePicker({suggestedName:logName(),types:[{description:'Chat log (JSON Lines)',accept:{'application/x-ndjson':['.jsonl']}}]})}
    catch{return}
  }
  LOG.h=h;LOG.name=h?h.name:'';LOG.base='';LOG.fix=0;
  LOG.on=true;LOG.n=0;LOG.err=0;LOG.mem=[];LOG.buf=[];logUI();hideAsk();
}
async function stopLog(){
  LOG.on=false;
  if(LOG.h){clearTimeout(LOG.t);while(LOG.busy)await new Promise(r=>setTimeout(r,50));await flush();LOG.h=null;LOG.err=0}
  else if(LOG.mem.length){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([LOG.base,...LOG.mem],{type:'application/x-ndjson'}));a.download=LOG.name||logName();a.click();LOG.mem=[]}
  LOG.base='';LOG.name='';LOG.fix=0;
  logUI();
}

const PR={twitch:'tw',kick:'kk',youtube:'yt'};
function parseLog(txt){
  const out=[];
  for(const ln of txt.split('\n')){
    const s=ln.trim();if(!s)continue;
    let o;try{o=JSON.parse(s)}catch{continue}
    if(!o||typeof o!=='object'||!o.user)continue;
    const ts=Date.parse(o.time);if(!ts)continue;
    const ev=o.type==='alert'?{k:String(o.kind||''),t:String(o.event||'')}:null,t=o.text?String(o.text):'';
    if(!t&&!ev)continue;
    out.push({ts,p:PR[o.platform]||'',ch:String(o.channel||''),name:String(o.user),t,ev,rp:o.replyTo&&o.replyTo.user?{n:String(o.replyTo.user),t:String(o.replyTo.text||'')}:null});
  }
  return out;
}
function loadRecs(recs){
  const touched=new Set();
  for(const r of recs){const u=userAdd(r.p,r.name,{ts:r.ts,t:r.t,ev:r.ev,rp:r.rp},false);if(u)touched.add(u);if(!r.ev)lbAdd(r.p,r.ch,r.name,r.t,extract(r.t),r.ts)}
  userFix(touched);
  if(uOpen&&UM.get(uOpen.k)===uOpen)uhList();
  if(!srp.hidden){if(srq.value.trim())srRun();else srHint()}
}
async function pickLog(){
  if(LOG.fs){
    try{
      const[h]=await showOpenFilePicker({mode:'readwrite',types:[{description:'Chat log (JSON Lines)',accept:{'application/x-ndjson':['.jsonl','.ndjson'],'text/plain':['.txt','.log']}}]});
      let w=false;
      try{w=(await h.queryPermission({mode:'readwrite'}))==='granted'||(await h.requestPermission({mode:'readwrite'}))==='granted'}catch{}
      return{h,w,name:h.name,read:async()=>(await h.getFile()).text()};
    }catch(e){if(e.name!=='AbortError')console.warn(e);return null}
  }
  return new Promise(res=>{
    const i=$('#logfile');i.value='';
    i.onchange=()=>{const f=i.files[0];res(f?{h:null,w:false,name:f.name,read:()=>f.text()}:null)};
    i.oncancel=()=>res(null);i.click();
  });
}
async function openLog(){
  if(LOG.opening)return;LOG.opening=1;
  try{
    const f=await pickLog();if(!f)return;
    let txt=await f.read(),recs=parseLog(txt);
    if(txt.trim()&&!recs.length){note("That file doesn't look like a chat log from this app, so it was left untouched: "+f.name);return}
    LOG.sw=1;LOG.pend=[];
    const old=LOG.h;
    if(LOG.on)await stopLog();
    if(old&&f.h&&await old.isSameEntry(f.h).catch(()=>false)){txt=await f.read();recs=parseLog(txt)}
    loadRecs(recs);
    const nl=!txt||txt.endsWith('\n');
    LOG.h=f.w?f.h:null;LOG.name=f.name;LOG.base=f.w?'':(nl?txt:txt+'\n');LOG.fix=f.w&&!nl?1:0;
    LOG.on=true;LOG.n=recs.length;LOG.err=0;LOG.mem=[];LOG.buf=[];
    for(const ln of LOG.pend){if(LOG.h)LOG.buf.push(ln);else LOG.mem.push(ln);LOG.n++}
    if(LOG.h&&LOG.buf.length&&!LOG.t)LOG.t=setTimeout(flush,4000);
    LOG.sw=0;LOG.pend=[];logUI();hideAsk();
    const c=recs.length.toLocaleString()+' earlier message'+(recs.length===1?'':'s');
    note(LOG.h?'Opened '+f.name+' - '+c+' loaded. New chat is added to the end of this file and nothing already in it is changed. Click a name to see what they have said, or use Search to look for a user or message.'
      :'Opened '+f.name+' - '+c+' loaded. This browser cannot edit the file in place, so new chat is kept in this tab and the combined file downloads when you stop logging. Use Search to look through it.');
  }catch(e){console.warn(e);note('Could not open that file.')}
  finally{LOG.opening=0;LOG.sw=0;LOG.pend=[]}
}
const ask=$('#logask');
function hideAsk(){ask.hidden=true;if(stick)chat.scrollTop=chat.scrollHeight}
function askLog(){if(LOG.on||LOG.asked)return;LOG.asked=1;ask.hidden=false;if(stick)chat.scrollTop=chat.scrollHeight}
if(!LOG.fs){$('#logask-t').textContent="Your browser can't write files directly, so the log stays in this tab until you download it.";$('#logask-y').textContent='Start log'}
$('#logask-y').onclick=startLog;$('#logask-n').onclick=hideAsk;$('#logask-o').onclick=openLog;$('#logo').onclick=openLog;
$('#logb').onclick=()=>LOG.on?stopLog():startLog();
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
addEventListener('beforeunload',e=>{if(LOG.on&&!LOG.h&&LOG.mem.length)e.preventDefault()});
